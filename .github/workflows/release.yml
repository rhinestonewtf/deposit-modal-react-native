name: Release

# A push to main runs changesets/action: it opens a Release PR while changesets
# are pending, and publishes @latest once that PR is merged.
#
# There is no npm token here — publishing is npm trusted publishing over OIDC,
# and the trust npmjs.com holds is pinned to this file's NAME. Renaming this
# workflow, or moving the publish step into another one, fails the publish on
# authorization with nothing naming the cause.
#
# Unlike `deposit-modal` there is no snapshot channel and no `release` branch.
# The snapshot exists there to pin the hosted page to an npm tag; this package
# has no hosted artifact, and its only pre-release consumer is the example app,
# which resolves it from the working tree.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publint
        run: bunx publint

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The Release PR is pushed as the app rather than as GITHUB_TOKEN, whose
      # pushes fire no workflows — a release PR nothing has checked is worse
      # than no release PR.
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use OIDC-capable npm
        # Trusted publishing needs npm >= 11.5.1, and the runner's bundled npm
        # is older. Pinned rather than `latest`: npm 12.0.0 (2026-07-08) ships a
        # broken provenance path ("Cannot find module 'sigstore'") that fails
        # `changeset publish`; 11.18.0 is the last known-good release.
        run: sudo npm install -g npm@11.18.0

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: release"
          title: "Release"
          publish: bun run changeset:release
          version: bun run changeset:version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # No provenance here. npm verifies the sigstore bundle against the
          # source repository's visibility and rejects the whole publish with
          # E422 — "Only public source repositories are supported when
          # publishing with provenance" — so turning it on while this repo is
          # private does not degrade, it fails the release. Make the repo public
          # first, then set `NPM_CONFIG_PROVENANCE: true`.

      - name: Label the Release PR
        # `agent-gate` reports "Awaiting classification" and waits indefinitely
        # without a ship/show/ask label, and a bot's PR has nobody watching to
        # add one.
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr edit ${{ steps.changesets.outputs.pullRequestNumber }} --add-label ship
